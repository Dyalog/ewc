name: Update Licenses

# Manual trigger (Actions → "Update Licenses"), or when the dependency set
# changes on main. Regenerates client/LICENSES.md from the installed tree and
# opens a PR so licence changes get reviewed. Mirrors the update-docs PR flow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - yarn.lock
      - package.json
      - client/package.json

permissions:
  # contents: write to push the bot branch; pull-requests: write to open the PR.
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        # --frozen-lockfile so the notice reflects the committed lockfile exactly.
        run: yarn install --frozen-lockfile

      - name: Regenerate LICENSES.md
        run: yarn licenses:update

      - name: Open PR with updated licences
        # Commits only add-paths, reuses a fixed head branch, opens/updates the
        # PR. GITHUB_TOKEN-authored PRs don't trigger downstream workflows.
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: client/LICENSES.md
          branch: licenses-update/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          commit-message: "chore: regenerate third-party licence notices (run #${{ github.run_number }})"
          title: "chore: regenerate third-party licence notices (${{ github.ref_name }})"
          body: |
            Regenerated `client/LICENSES.md` from the installed dependency tree via `yarn licenses:update`.

            ### Review checklist

            - [ ] Scan for **licence changes** on existing packages — a permissive → copyleft or → commercial switch is the thing this file exists to catch
            - [ ] Check any entry whose licence is not a plain SPDX id (e.g. `Custom`, `Unknown`)
            - [ ] Version-only churn needs no scrutiny

            > **Platform note:** `@esbuild/*` and `@rollup/*` are platform-gated optional deps, so this runner's Linux builds replace whatever the last generator host produced. Regenerating on macOS will flip those two lines back — let this workflow own the file.

            > **Fonts** are listed by hand at the top of `ci/gen-licenses.cjs`; yarn cannot see them. Update that list when a font is added, removed or upgraded.

            ---
            _Generated by run #${{ github.run_number }}_
